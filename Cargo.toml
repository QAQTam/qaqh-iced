[package]
name = "qaqh-iced"
version = "0.1.0"
edition = "2024"
description = "QAQ-Harness iced 桌面前端(Ringing v2,复用 qaqh-client 传输层)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "qaqh-iced"
path = "src/main.rs"

[dependencies]
# GUI 框架(当前最新稳定版)。wgpu 渲染失败时自动回退 tiny-skia 软件渲染。
# `tokio` 让 iced 的 async executor 跑在 tokio 上;`markdown` 用于助手文本块。
iced = { version = "0.14", features = ["tokio", "markdown"] }
# 传输层权威实现(与 qaqh-tui-app 同款 path 依赖):发现/lease/open、
# per-seed 单流与 timeline 流、命令面与服务面全部由它承担,本仓不自建。
qaqh-client = { path = "../qaqh-backend/crates/qaqh-client" }
# 配置契约层(K1 叶子:只依赖 serde):ConfigDto 读模型 / ConfigPatch 写模型,
# 与 TUI 同款 path 依赖,本仓不镜像 wire 形状。
qaqh-config-api = { path = "../qaqh-backend/crates/qaqh-config-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅用 sync 原语(mpsc/watch)与轻量时间工具;所有客户端任务都 spawn 在
# qaqh-client 自己的全局 runtime 上(qaqh_client::runtime_handle())。
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
log = { version = "0.4", features = ["std"] }

[profile.dev]
# 对齐 TUI 仓的取舍:仅保留行号信息,大幅削减链接与 DWARF 生成时间。
debug = 1

[profile.release]
lto = "thin"
strip = "symbols"
